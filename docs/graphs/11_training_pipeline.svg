<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1207" viewBox="0 0 1200 1207" role="img" aria-labelledby="title desc">
<title id="title">Entraînement, validation et observabilité</title>
<desc id="desc">Les données sont préparées avec une partition d’entraînement et de validation. Le modèle natif calcule prédictions et objectif, puis les gradients sont routés et l’optimiseur met à jour les poids. La validation évalue sans pas optimiseur. Les métriques et checkpoints restent liés au run. Sources : src/Model.hpp, src/Models/MLP/BasicMLPModel.cpp, src/Models/NLP/CausalLMModel.cpp, src/scriptings/Lua/luaScripting/LuaScriptingModelAndRegistry.cpp</desc>
