<text x="66" y="809" font-size="18" fill="#334155">
<tspan x="66" dy="0">• Pour comparer couches et paramètres : inspecter chaque classe avec sa configuration exacte et</tspan>
<tspan x="66" dy="26">conserver cette configuration avec le résultat.</tspan>
<tspan x="66" dy="26">• Les noms de modèles ne fournissent pas de poids préentraînés. Le modèle à retenir dépend des entrées,</tspan>
<tspan x="66" dy="26">des sorties, de la loss et du workflow.</tspan>
</text>
