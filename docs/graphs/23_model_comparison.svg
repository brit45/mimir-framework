<title id="title">Comparer les rôles avant les paramètres</title>
<desc id="desc">Comparaison des familles illustrées dans cette section : VAEConv reconstruit via un latent spatial ; UNet transforme une image avec des connexions de saut ; DiffusionModel est un prédicteur de bruit MLP ; sd3_5 reste un squelette ; les variantes VGG16 et VGG19 sont des classifieurs aux topologies et sorties différentes. Aucune métrique issue d’un ancien dump n’est présentée comme universelle. Sources : src/Models/Registry/ModelArchitectures.cpp, src/Models/Vision/VAEConvModel.hpp, src/Models/Vision/UNetModel.hpp, src/Models/Diffusion/DiffusionModel.hpp, src/Models/Diffusion/SD35Model.hpp, src/Models/Vision/CNN/VGG16Model.cpp, src/Models/Vision/CNN/VGG19Model.cpp</desc>
