<title id="title">Inspecter, exporter, puis analyser</title>
<desc id="desc">Les outils inspectent le registre et un profil de configuration, exportent explicitement des artefacts, puis analysent les métadonnées et poids disponibles. Le nombre de paramètres dépend du profil et ne doit pas être attaché à un nom de modèle seul. Sources : scripts/tools/inspect_architectures.lua, scripts/tools/analyze_model.lua, src/Serialization/Serialization.hpp</desc>
