<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1184" viewBox="0 0 1200 1184" role="img" aria-labelledby="title desc">
<title id="title">UNet natif : descente, sauts et remontée</title>
<desc id="desc">La classe UNetModel dérive de Model. Chaque niveau de descente applique deux convolutions ReLU et conserve un skip avant une convolution stride 2. Après le bottleneck, la remontée utilise UpsampleNearest, une concaténation avec le skip correspondant et deux convolutions. Une convolution 1×1 et Tanh produisent l’image de sortie. Sources : src/Models/Vision/UNetModel.hpp, src/Models/Vision/UNetModel.cpp</desc>
