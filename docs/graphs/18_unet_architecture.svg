<text x="66" y="964" font-size="18" fill="#334155">
<tspan x="66" dy="0">• Descente et remontée sont répétées depth fois. La remontée répète le motif upsample → concat →</tspan>
<tspan x="66" dy="26">convolutions à chaque niveau.</tspan>
<tspan x="66" dy="26">• Choisir des dimensions spatiales qui alignent les tenseurs des skips. Ce schéma ne représente pas un</tspan>
<tspan x="66" dy="26">pipeline de diffusion complet.</tspan>
<tspan x="66" dy="26">• Tenseurs de saut → Concaténation : niveau associé</tspan>
</text>
