<title id="title">Ce que fait la fabrique</title>
<desc id="desc">Le registre reçoit un nom et une configuration, trouve la fabrique de la classe dérivée et appelle sa construction C++. Il retourne une instance dont les noms, formes et tailles de paramètres sont décrits. Allocation et initialisation viennent ensuite. Sources : src/Models/Registry/ModelArchitectures.cpp, src/Models/MLP/BasicMLPModel.hpp, src/Models/MLP/BasicMLPModel.cpp</desc>
