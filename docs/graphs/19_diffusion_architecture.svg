<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="882" viewBox="0 0 1200 882" role="img" aria-labelledby="title desc">
<title id="title">Diffusion : prédicteur de bruit MLP</title>
<desc id="desc">DiffusionModel dérive de Model et prédit un bruit epsilon à partir d’un embedding temporel concaténé à une image bruitée. Son graphe est un MLP avec Linear, GELU, Dropout optionnel et projection Linear. La préparation du bruit et l’itération du scheduler sont des étapes du workflow de diffusion, pas des nœuds cachés dans ce MLP. Sources : src/Models/Diffusion/DiffusionModel.hpp, src/Models/Diffusion/DiffusionModel.cpp</desc>
