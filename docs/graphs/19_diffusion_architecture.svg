<tspan x="66" dy="26">• Le scheduler et la préparation de x_t appartiennent au chemin de diffusion utilisé. Un checkpoint</tspan>
<tspan x="66" dy="26">entraîné et un workflow compatible restent nécessaires.</tspan>
</text>
