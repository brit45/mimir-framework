<text x="66" y="1036" font-size="18" fill="#334155">
<tspan x="66" dy="0">• La variante Mímir n’est pas le VGG16 canonique : elle utilise LayerNorm et une convolution de réduction</tspan>
<tspan x="66" dy="26">supplémentaire par bloc, pas MaxPool.</tspan>
<tspan x="66" dy="26">• B, fc_hidden, num_classes, dropout et les dimensions d’image déterminent les paramètres. La sortie</tspan>
<tspan x="66" dy="26">native est un vecteur de logits.</tspan>
</text>
