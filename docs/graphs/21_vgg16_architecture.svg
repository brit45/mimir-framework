<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc">
<title id="title">VGG16 : variante native configurable</title>
<desc id="desc">VGG16Model dérive de Model. Les cinq blocs utilisent deux, deux, trois, trois puis trois convolutions de base avec LayerNorm sans paramètres et ReLU, suivies chacune d’une réduction par convolution stride 2. Une agrégation spatiale globale alimente deux couches denses GELU puis une projection vers les logits. La largeur de base et la tête sont configurables. Sources : src/Models/Vision/CNN/VGG16Model.hpp, src/Models/Vision/CNN/VGG16Model.cpp</desc>
