<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1233" viewBox="0 0 1200 1233" role="img" aria-labelledby="title desc">
<title id="title">sd3_5 : squelette natif, pas SD3.5 complet</title>
<desc id="desc">SD35Model est un squelette C++ dérivé de Model. L’entrée contient un flux query et un flux key/value aplatis. Le mode stub_only renvoie le flux query ; sinon une petite pile LayerNorm, self-attention, cross-attention et MLP résiduel est construite. Le flux KV demeure fixe dans cette pile. Cela ne constitue pas une implémentation ni un checkpoint complet de Stable Diffusion 3.5. Sources : src/Models/Diffusion/SD35Model.hpp, src/Models/Diffusion/SD35Model.cpp, src/Models/Registry/ModelArchitectures.cpp</desc>
