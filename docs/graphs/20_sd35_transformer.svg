<tspan x="66" dy="26">• Le nombre de blocs, les dimensions et le mode stub_only sont définis par Config. Aucune ancienne</tspan>
<tspan x="66" dy="26">métrique de dump n’est reprise ici.</tspan>
<tspan x="66" dy="26">• Séparation des flux → Mode stub_only : stub_only=true</tspan>
</text>
