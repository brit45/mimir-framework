<tspan x="1087" dy="0">μ, logvar</tspan>
</text>
<rect x="44" y="1115" width="1112" height="162" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="66" y="1143" font-size="18" fill="#334155">
<tspan x="66" dy="0">• conv_mode = 2d, 3d ou 4d : les modes ND ajoutent des axes de taille 1 ; ils n’inventent ni volume ni temps.</tspan>
<tspan x="66" dy="26">• En 3d/4d, conv_transpose est remplacé par nearest_conv ; bilinear_conv et pixel_shuffle gardent leur</tspan>
<tspan x="66" dy="26">upsampling 2D. Échantillonnage si stochastique et entraînement.</tspan>
<tspan x="66" dy="26">• logvar = 0 donne σ = 1. Le prior optionnel est un biais latent appris. Les scripts d’inférence</tspan>
<tspan x="66" dy="26">sélectionnent recon ou μ ; la reprise conserve la topologie.</tspan>
</text>
