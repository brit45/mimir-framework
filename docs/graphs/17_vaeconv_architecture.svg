<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1363" viewBox="0 0 1200 1363" role="img" aria-labelledby="title desc">
<title id="title">VAEConv natif : latent et sorties</title>
<desc id="desc">Le VAE convolutionnel adapte une image HWC à son encodeur, produit mu et logvar, construit un latent spatial puis décode une reconstruction. Le mode entraînement rassemble reconstruction, mu et logvar ; l’inférence sélectionne la reconstruction. Les branches et dimensions sont configurables, sans nombres de paramètres issus d’un ancien dump. Sources : src/Models/Vision/VAEConvModel.hpp, src/Models/Vision/VAEConvModel.cpp, src/runtimes/cpu/RuntimeLayerDispatch.hpp, src/Models/VAETraining.cpp</desc>
