<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1239" viewBox="0 0 1200 1239" role="img" aria-labelledby="title desc">
<title id="title">Analyser un checkpoint identifié</title>
<desc id="desc">L’analyse détecte le format, lit les métadonnées et les tenseurs disponibles, puis produit statistiques et représentation du graphe observé. L’absence de topologie ou des valeurs tronquées limite les conclusions. Les CSV d’entraînement doivent appartenir au même run. Sources : scripts/tools/analyze_model.lua, scripts/tools/show-graph.lua, src/Serialization/Serialization.hpp</desc>
<metadata>{&quot;generator&quot;: &quot;scripts/docs/generate_diagrams.py&quot;, &quot;sources&quot;: [&quot;scripts/tools/analyze_model.lua&quot;, &quot;scripts/tools/show-graph.lua&quot;, &quot;src/Serialization/Serialization.hpp&quot;], &quot;related_docs&quot;: [&quot;docs/02-User-Guide/08-Checkpoints.md&quot;, &quot;docs/02-User-Guide/16-Show-Graph-Metrics.md&quot;]}</metadata>
