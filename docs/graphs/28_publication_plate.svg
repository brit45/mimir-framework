<title id="title">De la contribution à la documentation publiée</title>
<desc id="desc">Parcours de contribution : modifier les sources dans leur couche de responsabilité, vérifier les résultats et les limites, actualiser les pages et schémas, exécuter les contrôles locaux et la CI, puis publier après revue. Le workflow wiki copie les pages et ressources lors des pushes concernés. Sources : .github/workflows/unit-tests.yml, .github/workflows/wiki.yml, scripts/tools/verify_docs.py, scripts/tools/verify_api_sync.sh</desc>
