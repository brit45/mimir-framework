<title id="title">Exécution du graphe et routage</title>
<desc id="desc">La topologie native est définie dans une classe C++ dérivée de Model. Le plan contient les opérations, durées de vie et groupes. RuntimeRouter sélectionne un backend adapté aux entrées et lui délègue les calculs, en forward et backward. Sources : src/Model.cpp, src/Planning/Planner.hpp, src/runtimes/RuntimeRouter.cpp, src/runtimes/cpu/RuntimeLayerDispatch.hpp</desc>
