<tspan x="66" dy="0">• Model.build() est un appel de compatibilité : create a déjà construit le graphe.</tspan>
<tspan x="66" dy="26">• Ne pas réinitialiser les poids après un chargement destiné à une reprise ou une inférence.</tspan>
<tspan x="66" dy="26">• Faire une inférence → Sauvegarder le run : si nécessaire</tspan>
</text>
