<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc">
<title id="title">Cycle de vie du modèle natif</title>
<desc id="desc">Le registre construit une classe C++ dérivée de Model. Les paramètres sont alloués avant une initialisation neuve ou un chargement compatible. Le modèle est ensuite utilisé en entraînement ou en inférence, puis sauvegardé. Sources : src/Model.hpp, src/Models/Registry/ModelArchitectures.cpp, src/Serialization/Serialization.hpp</desc>
