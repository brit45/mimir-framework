<title id="title">Inférence depuis un checkpoint</title>
<desc id="desc">La configuration et le checkpoint déterminent une architecture native compatible. Après construction et allocation, les poids et assets sont chargés sans réinitialisation. Les entrées sont préparées, le forward d’évaluation est exécuté et la sortie est décodée selon l’architecture. Sources : src/Model.hpp, src/Serialization/Serialization.hpp, scripts/inferences/causal_lm_generate.lua</desc>
