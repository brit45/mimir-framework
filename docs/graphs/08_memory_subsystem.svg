<text x="66" y="1039" font-size="18" fill="#334155">
<tspan x="66" dy="0">• Les flèches relient des responsabilités ; toutes les allocations ne passent pas par le même allocateur.</tspan>
<tspan x="66" dy="26">• MemoryGuard ne mesure que les chemins instrumentés. Un scratchpad conservé peut rester réservé.</tspan>
<tspan x="66" dy="26">• Paramètres et états → Tenseurs dynamiques : si dynamiques</tspan>
<tspan x="66" dy="26">• Tenseurs dynamiques → MemoryGuard : réserve</tspan>
</text>
