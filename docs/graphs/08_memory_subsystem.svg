<title id="title">Mémoire : responsabilités et budgets</title>
<desc id="desc">MemoryGuard suit les réservations instrumentées. DynamicTensorAllocator gère les tenseurs qui utilisent son chemin. RuntimeAllocator propose des handles RAII et un pool de scratchpads. Les copies device et le RSS du processus ne se confondent pas avec ces compteurs. Sources : src/MemoryGuard.hpp, src/runtimes/cpu/RuntimeAllocator.hpp, src/runtimes/cpu/DynamicTensorAllocator.hpp, src/AdvancedRAMManager.hpp</desc>
