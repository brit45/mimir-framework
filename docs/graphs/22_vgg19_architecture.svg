<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1259" viewBox="0 0 1200 1259" role="img" aria-labelledby="title desc">
<title id="title">VGG19 : blocs canoniques et Softmax</title>
<desc id="desc">VGG19Model dérive de Model. Les blocs convolutifs ont des canaux fixes 64, 128, 256, 512, 512 ; chaque convolution est suivie de ReLU et chaque bloc de MaxPool2d. L’aplatissement alimente deux couches denses ReLU avec Dropout facultatif. Une couche Linear et Softmax donnent la sortie. Cette structure diffère de la variante VGG16 du framework. Sources : src/Models/Vision/CNN/VGG19Model.hpp, src/Models/Vision/CNN/VGG19Model.cpp</desc>
