<rect x="44" y="985" width="1112" height="188" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="66" y="1013" font-size="18" fill="#334155">
<tspan x="66" dy="0">• Les canaux 64/128/256/512/512 sont fixés dans le builder actuel ; changer base_channels ne les modifie</tspan>
<tspan x="66" dy="26">pas.</tspan>
<tspan x="66" dy="26">• H′ et W′ résultent des cinq MaxPool. Dimensions d’image, fc_hidden, num_classes et dropout</tspan>
<tspan x="66" dy="26">déterminent la tête et le nombre de paramètres.</tspan>
<tspan x="66" dy="26">• La sortie native comprend Softmax. Elle ne doit pas être confondue avec les logits fournis par la</tspan>
<tspan x="66" dy="26">variante VGG16.</tspan>
</text>
