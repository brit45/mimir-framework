<title id="title">Familles du registre des couches</title>
<desc id="desc">Le registre LayerType comprend les convolutions ND et causales, SwiGLU, les primitives Primer, les couches de projection et de normalisation, l’attention et les opérations de tenseurs. Ces catégories illustrent les noms canoniques sans figer un ancien nombre de types. Sources : src/LayerTypes.hpp, src/runtimes/PrimerGeometry.hpp, src/runtimes/cpu/RuntimeLayerDispatch.hpp</desc>
