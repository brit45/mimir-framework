<title id="title">Quand utiliser Lua, JSON et l’inspection</title>
<desc id="desc">Lua sert à orchestrer le run ; JSON conserve ses valeurs de configuration. Les outils d’inspection lisent le registre, les capacités et les métadonnées de checkpoints. La définition du graphe demeure en C++ ou dans un MPK expérimental. Sources : scripts/modules/pipeline_api.lua, src/main.cpp, scripts/tools/inspect_architectures.lua, scripts/tools/analyze_model.lua</desc>
