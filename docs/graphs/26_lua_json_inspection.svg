<tspan x="66" dy="0">• Ni Lua ni JSON ne sont des langages de définition du graphe DL.</tspan>
<tspan x="66" dy="26">• MPK est une description alternative expérimentale, encore partielle pour la production.</tspan>
<tspan x="66" dy="26">• Une capacité déclarée par type ne prouve pas le backend réellement choisi pour une opération.</tspan>
</text>
