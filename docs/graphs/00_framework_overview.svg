<tspan x="66" dy="26">• CPU-first désigne une référence et un repli : le backend effectif dépend des capacités et du plan.</tspan>
<tspan x="66" dy="26">• Pilotage du run → Registre : sélection</tspan>
<tspan x="66" dy="26">• Données préparées → Instance du modèle : entrées</tspan>
</text>
