<title id="title">Vue d’ensemble de Mímir</title>
<desc id="desc">La topologie native appartient à une classe C++ dérivée de Model. Les scripts et configurations sélectionnent le modèle ; le routeur, les runtimes et les services de suivi exécutent le run. MPK est une alternative expérimentale. Sources : src/Models/Registry/ModelArchitectures.cpp, src/Model.hpp, src/runtimes/RuntimeRouter.cpp, src/AsyncMonitor.hpp</desc>
