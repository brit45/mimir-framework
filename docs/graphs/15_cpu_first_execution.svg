<tspan x="66" dy="0">• AVX256 désigne la largeur 256 bits d’AVX ; le dispatch vérifie le matériel et l’état de l’OS.</tspan>
<tspan x="66" dy="26">• Le repli CPU exige un CPU activé. La présence d’un kernel GPU ne garantit pas un gain de vitesse.</tspan>
<tspan x="66" dy="26">• Runtime accéléré → Refus contrôlé : si refus</tspan>
</text>
