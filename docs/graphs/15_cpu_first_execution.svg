<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1233" viewBox="0 0 1200 1233" role="img" aria-labelledby="title desc">
<title id="title">CPU-first : référence et repli</title>
<desc id="desc">Le CPU est la référence générale et le repli lorsqu’il est activé et compatible. Le routeur peut préférer un backend natif admissible selon la politique ou la calibration. Les variantes SIMD sont choisies selon les capacités du CPU et de l’OS. Sources : src/runtimes/RuntimeRouter.cpp, src/runtimes/cpu/SimdDispatch.cpp, src/Planning/ExecutionPolicy.hpp</desc>
