<title id="title">Créer et préparer une instance</title>
<desc id="desc">Le script fournit un nom et des valeurs. Le registre résout la configuration et instancie une classe C++ dérivée de Model. Sa construction produit les couches, puis le run alloue les paramètres et choisit initialisation ou chargement avant le forward. Sources : src/Models/Registry/ModelArchitectures.cpp, src/Models/MLP/BasicMLPModel.cpp, src/scriptings/Lua/luaScripting/LuaScriptingModelAndRegistry.cpp</desc>
