<title id="title">Formats de sauvegarde et reprise</title>
<desc id="desc">La sérialisation reçoit le modèle et les options d’export. RawFolder et SafeTensors transportent poids et métadonnées selon leurs options. DebugJSON sert à l’inspection et peut tronquer les valeurs. Une reprise exige le bon graphe et l’état d’entraînement utile. Sources : src/Serialization/Serialization.hpp, src/Serialization/RawCheckpointWriter.cpp, src/Serialization/SafeTensorsWriter.cpp, scripts/modules/checkpoint_resume.lua</desc>
