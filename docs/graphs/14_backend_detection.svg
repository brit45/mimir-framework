<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1207" viewBox="0 0 1200 1207" role="img" aria-labelledby="title desc">
<title id="title">Du build au backend réellement exécuté</title>
<desc id="desc">Le binaire fournit les backends compilés. La configuration et les périphériques disponibles conditionnent leur initialisation. Chaque opération vérifie ses formes, valeurs et budgets ; le planner et le routeur choisissent un chemin, avec refus et repli si nécessaire. Sources : src/runtimes/AbstractRuntime.hpp, src/runtimes/RuntimeRouter.cpp, src/Planning/ExecutionCalibration.cpp, src/runtimes/cpu/SimdDispatch.cpp</desc>
