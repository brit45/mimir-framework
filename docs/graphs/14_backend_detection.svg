<tspan x="66" dy="0">• L’ordre de base ROCm → CUDA → Vulkan → OpenCL → TPU (si fourni) → CPU n’annule pas la sélection</tspan>
<tspan x="66" dy="26">mesurée par opération.</tspan>
<tspan x="66" dy="26">• Un test ignoré faute de device ne constitue pas une validation matérielle du backend.</tspan>
</text>
