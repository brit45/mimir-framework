<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1454" viewBox="0 0 1200 1454" role="img" aria-labelledby="title desc">
<title id="title">Flux des tenseurs nommés</title>
<desc id="desc">Model injecte les entrées dans les stores float et int. Il résout les entrées de chaque couche, délègue le calcul au routeur et publie les sorties nommées. Les activations nécessaires au backward sont conservées, et le plan peut libérer ou réutiliser les buffers selon leur durée de vie. Sources : src/Model.cpp, src/Layers.hpp, src/Planning/Planner.hpp, src/runtimes/RuntimeRouter.cpp</desc>
