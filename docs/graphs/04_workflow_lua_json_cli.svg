<title id="title">Workflow CLI, Lua et JSON</title>
<desc id="desc">Le lanceur transmet les arguments au script et injecte la configuration JSON. Le script sélectionne une architecture du registre, configure le run, charge éventuellement son checkpoint et appelle son exécution. Les couches sont définies par la classe C++. Sources : run_mimir.sh, src/main.cpp, src/scriptings/Lua/luaScripting/LuaScripting.cpp, scripts/modules/pipeline_api.lua</desc>
