<title id="title">Architecture en couches</title>
<desc id="desc">Le pilotage utilise les fabriques du registre pour obtenir une instance de classe dérivée de Model. Le modèle orchestre le graphe ; les runtimes portent les calculs. Mémoire, sérialisation et observation accompagnent le cycle de vie. Sources : src/Model.hpp, src/runtimes/AbstractRuntime.hpp, src/runtimes/RuntimeRouter.hpp, src/Planning/Planner.hpp</desc>
