name: unit-tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read project version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Print version
        run: echo "Building Mímir Framework v${{ steps.version.outputs.VERSION }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            g++ \
            liblua5.3-dev \
            liblz4-dev

      - name: Install runtime bridge dependencies
        run: |
          set -euo pipefail
          cargo install rust-script --locked
          dotnet tool install -g dotnet-script
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMIMIR_ENABLE_TESTS=ON \
            -DENABLE_VULKAN=OFF \
            -DENABLE_OPENCL=OFF \
            -DENABLE_SFML=OFF \
            -DENABLE_OPENMP=ON \
            -DENABLE_LZ4=ON

      - name: Build
        run: cmake --build build

      - name: Run unit tests (CTest)
        run: |
          export DOTNET_ROOT="$HOME/.dotnet"
          export PATH="$HOME/.dotnet/tools:$HOME/.cargo/bin:$PATH"
          ctest --test-dir build --output-on-failure --timeout 120

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-v${{ steps.version.outputs.VERSION }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/CTestTestfile.cmake
